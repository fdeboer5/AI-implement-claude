<style>
:root{--paper:#F4F6F8;--ink:#0E1B26;--muted:#4A5B69;--cobalt:#2547E8;--sea:#D3EBE2;--line:#C9D3DB;--card:#fff;
--f-head:ui-serif,Georgia,'Times New Roman',serif;--f-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#0C141B;--ink:#EDF2F6;--muted:#9FB0BD;--cobalt:#7C93FF;--sea:#17332B;--line:#243542;--card:#121E27}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--f-body)}
a{color:inherit}:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font:700 1.15rem var(--f-head);text-decoration:none}
nav a{margin-left:22px;text-decoration:none;color:var(--muted)}nav a:hover{color:var(--ink)}
h1,h2,h3{font-family:var(--f-head);line-height:1.12;margin:0}
h1{font-size:clamp(2.3rem,6vw,4rem);letter-spacing:-.02em;max-width:15ch}
h2{font-size:clamp(1.7rem,3.5vw,2.3rem);margin-bottom:28px}
.hero{padding:56px 0 72px;display:grid;gap:40px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero p{color:var(--muted);max-width:46ch;font-size:1.12rem}
.btn{display:inline-block;background:var(--cobalt);color:#fff;padding:13px 24px;border-radius:8px;text-decoration:none;font-weight:600;border:0}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:10px}
.flow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;font-size:.95rem}
.flow div{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.flow div:last-child{border:0}
.flow b{font-weight:600}.flow span{margin-left:auto;font-size:.82rem;padding:3px 10px;border-radius:99px;background:var(--sea)}
.flow .human span{background:transparent;border:1px solid var(--cobalt);color:var(--cobalt)}
section{padding:60px 0;border-top:1px solid var(--line)}
.svc{display:grid;gap:22px;grid-template-columns:repeat(3,1fr)}
.svc div{border-left:3px solid var(--cobalt);padding-left:18px}.svc h3{font-size:1.2rem;margin-bottom:8px}.svc p{margin:0;color:var(--muted)}
.pk{display:grid;gap:22px;grid-template-columns:repeat(3,1fr);align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column}
.card.featured{border:2px solid var(--cobalt)}
.price{font:700 2.3rem var(--f-head);margin:14px 0 0}.note{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.card ul{padding-left:20px;margin:14px 0 24px;flex:1}.card li{margin-bottom:6px}
.pay{font-size:.85rem;color:var(--muted);margin:12px 0 0}
ol{list-style:none;padding:0;margin:0;display:grid;gap:22px;grid-template-columns:repeat(4,1fr);counter-reset:s}
ol li{counter-increment:s;border-top:3px solid var(--ink);padding-top:14px}
ol li::before{content:counter(s);font:700 1.3rem var(--f-head);display:block;margin-bottom:6px}
ol h3{font-size:1.1rem;margin-bottom:6px}ol p{margin:0;color:var(--muted);font-size:.95rem}
details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);margin:10px 0 0;max-width:62ch}
footer{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:.92rem}
.thanks{padding:90px 0;max-width:620px}.thanks h1{margin-bottom:18px}
@media(max-width:820px){.hero,.svc,.pk,ol{grid-template-columns:1fr}nav{display:none}.btn.ghost{margin:12px 0 0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
